name: Android Build

on:
  push:
    branches: [android]
  workflow_call:
    inputs:
      version_name:
        required: false
        type: string
    secrets:
      ANDROID_UPLOAD_KEYSTORE_BASE64:
        required: true
      ANDROID_UPLOAD_KEYSTORE_PASSWORD:
        required: true
      ANDROID_UPLOAD_KEY_ALIAS:
        required: true
      ANDROID_UPLOAD_KEY_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      version_name:
        description: Android release version name
        required: false
        type: string

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: ${{ inputs.version_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: astral-sh/setup-uv@v6

      - name: Download and process card images
        run: uv run python utils/download_card_images.py assets/card_info/scryfall_cards.json.zst

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Ensure dependencies
        run: |
          go mod download
          go get github.com/hajimehoshi/ebiten/v2/cmd/ebitenmobile@v2.9.9

      - name: Build AAR with ebitenmobile
        run: |
          mkdir -p ./mobile/android/s30
          go run github.com/hajimehoshi/ebiten/v2/cmd/ebitenmobile bind \
            -target android \
            -tags embedded_card_images \
            -javapkg com.throwingbones.s30 \
            -o ./mobile/android/s30/s30.aar \
            ./mobile

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Restore upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          umask 077
          keystore_path="${RUNNER_TEMP}/s30-upload.jks"
          printf '%s' "${ANDROID_UPLOAD_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          echo "ANDROID_KEYSTORE_PATH=${keystore_path}" >> "${GITHUB_ENV}"

      - name: Build signed Android releases
        working-directory: ./mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: gradle bundleRelease assembleRelease

      - name: Verify signatures
        run: |
          set -o pipefail
          apksigner_path="${ANDROID_HOME}/build-tools/$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/apksigner"
          "${apksigner_path}" verify --verbose --print-certs \
            mobile/android/app/build/outputs/apk/release/app-release.apk
          jarsigner -verify -verbose -certs \
            mobile/android/app/build/outputs/bundle/release/app-release.aab \
            | tee "${RUNNER_TEMP}/aab-signature.txt"
          grep -Fq "jar verified." "${RUNNER_TEMP}/aab-signature.txt"

      - name: Prepare artifacts
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk s30_android.apk
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab s30_android.aab

      - uses: actions/upload-artifact@v4
        with:
          name: s30_android.apk
          path: s30_android.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: s30_android.aab
          path: s30_android.aab
          retention-days: 30
