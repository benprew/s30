name: Release Builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  card-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      - name: Download and process card images
        run: uv run python utils/download_card_images.py assets/card_info/scryfall_cards.json.zst

      - uses: actions/upload-artifact@v7
        with:
          name: card-images
          path: assets/art/cardimages.zip
          retention-days: 1

  build:
    needs: card-images
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: s30_linux
            updater: s30-updater_linux-amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            artifact: s30_linux-arm
            updater: s30-updater_linux-arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            artifact: s30_mac-intel
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact: s30_mac-apple-silicon
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact: s30_windows.exe
            updater: s30-updater_windows-amd64.exe
          - os: windows-latest
            goos: windows
            goarch: arm64
            artifact: s30_windows-arm.exe
            updater: s30-updater_windows-arm64.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v8
        with:
          name: card-images
          path: assets/art

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install libasound2-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev

      - name: Build
        env:
          S30_VERSION: ${{ inputs.version || github.ref_name }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
        run: |
          test -n "$UPDATE_PUBLIC_KEY" || { echo 'Set the UPDATE_PUBLIC_KEY repository variable' >&2; exit 1; }
          MACOSX_DEPLOYMENT_TARGET=12.0 CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath \
            -ldflags "-X github.com/benprew/s30/game/version.Current=${S30_VERSION} -X github.com/benprew/s30/game/updates.PublicKey=${UPDATE_PUBLIC_KEY}" \
            -tags embedded_card_images -o ${{ matrix.artifact }}

      - name: Build update helper
        if: matrix.goos != 'darwin'
        env:
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath \
            -ldflags "-X github.com/benprew/s30/game/updates.PublicKey=${UPDATE_PUBLIC_KEY}" \
            -o ${{ matrix.updater }} ./cmd/s30-updater

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.updater }}

  android:
    uses: ./.github/workflows/android.yml
    with:
      version_name: ${{ inputs.version || github.ref_name }}
    secrets: inherit

  ios:
    uses: ./.github/workflows/ios.yml
    with:
      version_name: ${{ inputs.version || github.ref_name }}

  release:
    needs: [build, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Sign update manifest
        env:
          S30_VERSION: ${{ inputs.version || github.ref_name }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: go run ./cmd/update-manifest -version "$S30_VERSION" -artifacts artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          ASSETS=(
            artifacts/s30_linux/s30_linux
            artifacts/s30_linux-arm/s30_linux-arm
            artifacts/s30_mac-intel/s30_mac-intel
            artifacts/s30_mac-apple-silicon/s30_mac-apple-silicon
            artifacts/s30_windows.exe/s30_windows.exe
            artifacts/s30_windows-arm.exe/s30_windows-arm.exe
            artifacts/s30_linux/s30-updater_linux-amd64
            artifacts/s30_linux-arm/s30-updater_linux-arm64
            artifacts/s30_windows.exe/s30-updater_windows-amd64.exe
            artifacts/s30_windows-arm.exe/s30-updater_windows-arm64.exe
            artifacts/s30_android.apk/s30_android.apk
            artifacts/s30_android.apk/s30_android.apk.idsig
            artifacts/s30_android.aab/s30_android.aab
            artifacts/s30_ios.ipa/s30_ios.ipa
            artifacts/s30_ios.xcarchive.zip/s30_ios.xcarchive.zip
            s30-update-manifest.json
            s30-update-manifest.json.sig
          )
          sha256sum "${ASSETS[@]}" | sed 's|  .*/|  |' > checksums.txt
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            checksums.txt \
            "${ASSETS[@]}"
