apply plugin: 'com.android.application'

def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def releaseKeystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def releaseSigningEnvironment = [
    ANDROID_KEYSTORE_PATH: releaseKeystorePath,
    ANDROID_KEYSTORE_PASSWORD: releaseKeystorePassword,
    ANDROID_KEY_ALIAS: releaseKeyAlias,
    ANDROID_KEY_PASSWORD: releaseKeyPassword,
]
def releaseSigningValues = releaseSigningEnvironment.values()
def releaseSigningConfigured = releaseSigningValues.every { it != null && !it.isEmpty() }
def releaseSigningPartiallyConfigured = releaseSigningValues.any { it != null && !it.isEmpty() } && !releaseSigningConfigured
def androidVersionCode = Integer.parseInt(System.getenv('ANDROID_VERSION_CODE') ?: '1')
def androidVersionName = System.getenv('ANDROID_VERSION_NAME') ?: '1.0.0'

android {
    namespace 'com.throwingbones.s30'
    compileSdk 36

    defaultConfig {
        applicationId "com.throwingbones.s30"
        minSdk 23
        targetSdk 36
        versionCode androidVersionCode
        versionName androidVersionName
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

if (releaseSigningPartiallyConfigured) {
    def missingReleaseSigningValues = releaseSigningEnvironment.findAll { key, value -> value == null || value.isEmpty() }.keySet()
    throw new GradleException("Android release signing environment is incomplete; missing: ${missingReleaseSigningValues.join(', ')}")
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation files('../s30/s30.aar')
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
            because 'kotlin-stdlib 1.8+ merges jdk7/jdk8 modules'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
            because 'kotlin-stdlib 1.8+ merges jdk7/jdk8 modules'
        }
    }
}
